<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>公會成員｜第一交響樂團</title>
  <meta name="description" content="第一交響樂團的成員列表，可依遊戲篩選。">
  <link rel="icon" href="assets/images/lyre.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&amp;display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script type="module" src="assets/js/pages/members.js"></script>
</head>
<body data-page="members">
  <header id="site-header" class="site-header"></header>
  <main id="main" tabindex="-1">
    <div class="page-head container">
      <h1 class="page-title">公會成員</h1>
      <p class="page-lead">每一位成員，都是樂團裡不可缺少的聲部。</p>
    </div>

    <section class="section section--tight container" aria-label="成員列表">
      <div class="toolbar">
        <label class="filter">
          <span class="filter__label">遊戲</span>
          <select id="member-filter">
            <option value="all">全部</option>
            <option value="mabinogi_m" data-game>瑪奇 M</option>
            <option value="mabinogi_pc" data-game>瑪奇（PC）</option>
          </select>
        </label>
        <p id="member-count" class="toolbar__count" aria-live="polite"></p>
      </div>
      <div id="member-list" class="member-grid">
        <p class="loading">成員載入中…</p>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
