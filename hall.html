<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>虛擬大廳（籌備中）｜第一交響樂團</title>
  <meta name="description" content="第一交響樂團的 2D 虛擬公會大廳構想，目前籌備中。">
  <link rel="icon" href="assets/images/lyre.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&amp;display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script type="module" src="assets/js/pages/simple.js"></script>
</head>
<body data-page="hall">
  <header id="site-header" class="site-header"></header>
  <main id="main" tabindex="-1">

    <div class="page-head container">
      <h1 class="page-title">虛擬大廳 <span class="status-badge">籌備中</span></h1>
      <p class="page-lead">一個可以走動的小小公會大廳，正在慢慢準備。</p>
    </div>
    <div class="container hall">
      <figure class="polaroid hall__figure">
        <div class="polaroid__frame">
          <img src="assets/images/placeholders/banner.svg" alt="佔位圖：未來虛擬大廳的示意畫面" width="2100" height="900">
        </div>
        <figcaption class="polaroid__caption"><span class="polaroid__title">未來的大廳畫面會放在這裡</span></figcaption>
      </figure>
      <section class="story-block" aria-labelledby="hall-idea">
        <h2 id="hall-idea" class="section__title">我們的構想</h2>
        <ul class="plain-list">
          <li>操控自己的小角色，在公會大廳裡走來走去。</li>
          <li>走到物品或成員旁邊，可以看看介紹、留下的話。</li>
          <li>大廳裡有公告板與相簿牆，連到網站上的回憶。</li>
          <li>電腦可以用鍵盤操作，手機可以用觸控操作。</li>
        </ul>
        <p class="prose-text muted">技術上可能會使用 Godot 匯出的網頁版本，或直接用 HTML5 Canvas 製作。完成之前，這一頁只是入口。</p>
        <p><a class="button" href="gallery.html">先去紀念館逛逛 →</a></p>
      </section>
    </div>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
