  <meta name="description" content="第一交響樂團的 2D 虛擬公會大廳構想，目前籌備中。">
  <link rel="icon" href="assets/images/icons/lyre.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&amp;family=Noto+Serif+TC:wght@700&amp;display=swap">

<body data-page="hall">
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header id="site-header" class="site-header"></header>
  <main id="main" class="page page--hall" tabindex="-1">
    <div class="page-head">
      <h1 class="page-title"><span class="tape">虛擬大廳</span></h1>
      <p class="page-lead">一個可以走進去的公會大廳。</p>
    </div>
    <section class="hall card" aria-labelledby="hall-title">
      <p class="stamp">籌備中</p>
      <figure class="polaroid tilt-b has-tape hall__photo">
        <img src="assets/images/placeholders/hall.svg" alt="佔位圖：虛擬大廳構想圖" width="1200" height="600">
        <figcaption>想像中的大廳一角</figcaption>
      </figure>
      <div class="hall__text">
        <h2 id="hall-title" class="hall__title">我們想做的事</h2>
        <ul class="hall__list">
          <li>操控自己的小角色，在公會大廳裡走動。</li>
          <li>和大廳裡的物品、成員互動，看看大家的介紹。</li>
          <li>在公告板看公會的近況，在相簿牆翻看舊照片。</li>
          <li>電腦用鍵盤、手機用觸控，都可以操作。</li>
        </ul>
        <p class="prose">目前還在構想階段，未來可能用 Godot（Web 匯出）或 HTML5 Canvas 製作。完成之前，先到其他頁面逛逛吧。</p>
        <p class="hall__links"><a class="btn" href="gallery.html">先去紀念館 <span aria-hidden="true">→</span></a></p>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
