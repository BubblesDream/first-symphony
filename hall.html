<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>虛擬公會城堡（原型）｜第一交響樂團</title>
  <meta name="description" content="走進第一交響樂團的虛擬公會城堡，看看公會成員在大廳與演奏室裡的日常。目前是第一版原型。">
  <link rel="icon" href="assets/images/icons/lyre.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC&amp;family=Noto+Serif+TC:wght@700&amp;display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <!-- 遊戲函式庫只在這一頁載入（CLAUDE.md 的城堡例外） -->
  <script defer src="assets/vendor/phaser/phaser.min.js"></script>
  <script type="module" src="assets/js/pages/hall.js"></script>
</head>
<body data-page="hall">
  <a class="skip-link" href="#main">跳到主要內容</a>
  <header id="site-header" class="site-header"></header>
  <main id="main" class="page page--hall" tabindex="-1">
    <div class="page-head">
      <h1 class="page-title"><span class="tape">虛擬公會城堡</span></h1>
      <p class="page-lead">走進城堡，看看大家今天在做什麼。<span class="castle-room" id="castle-room"></span></p>
    </div>

    <section class="castle" aria-label="虛擬公會城堡遊戲">
      <p class="castle__notice">第一版原型：目前開放「公會大廳」與「演奏室」。角色外觀與台詞多為<strong>示範資料</strong>，之後會換成成員提供的內容。</p>
      <div id="castle-stage" class="castle__stage" tabindex="0" aria-label="遊戲畫面。點一下或按 Tab 選取後，可用鍵盤操作。" aria-describedby="castle-help">
        <p class="castle__loading" id="castle-loading">城堡載入中…</p>
        <p class="castle__focus-hint" aria-hidden="true">點一下畫面開始操作</p>
      </div>
      <div class="castle__help" id="castle-help">
        <h2 class="castle__help-title">怎麼玩</h2>
        <ul>
          <li><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向鍵：移動</li>
          <li><kbd>E</kbd> 或空白鍵：和附近的成員聊天、查看物品</li>
          <li>滑鼠點地板：走過去；點成員：聊天（手機用手指點）</li>
          <li><kbd>Esc</kbd>：關閉對話</li>
          <li>走進有金色框的門：換房間</li>
        </ul>
        <p>每次重新整理頁面，城堡裡的成員都會重新抽選。</p>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
</body>
</html>
